<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sora',sans-serif;background:#07101d;color:#e2e8f0;min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:4px}

/* ── Cards ── */
.card{background:linear-gradient(145deg,#0c1d33,#091525);border:1px solid rgba(100,160,255,0.07);border-radius:16px}
.card-p{padding:16px}
.hero-card{background:linear-gradient(145deg,#0f1e38,#0b1528,#110c25);border:1px solid rgba(99,102,241,0.2);border-radius:16px;box-shadow:0 0 40px rgba(99,102,241,0.07)}

/* ── Layout ── */
.main{max-width:600px;margin:0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.flex{display:flex}.frow{display:flex;align-items:center}.fcol{display:flex;flex-direction:column}
.jbet{justify-content:space-between}.jcen{justify-content:center}.astart{align-items:flex-start}
.gap2{gap:8px}.gap3{gap:12px}.gap4{gap:16px}
.f1{flex:1}.shrink0{flex-shrink:0}.minw0{min-width:0}
.wrap{flex-wrap:wrap}
.tr{text-align:right}.tc{text-align:center}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mb5{margin-bottom:20px}
.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}
.pr2{padding-right:8px}
.ovx{overflow-x:auto}

/* ── Typography ── */
.xs{font-size:11px}.sm{font-size:13px}.base{font-size:15px}.lg{font-size:18px}.xl{font-size:22px}.x2l{font-size:28px}
.fw5{font-weight:500}.fw6{font-weight:600}.fw7{font-weight:700}.fw8{font-weight:800}
.white{color:#fff}.muted{color:#64748b}.sub{color:#94a3b8}
.green{color:#10b981}.red{color:#ef4444}.indigo{color:#818cf8}.purple{color:#c084fc}.amber{color:#fbbf24}.cyan{color:#22d3ee}

/* ── Pills ── */
.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:11px}
.pill-lg{padding:5px 12px;font-size:13px}
.up{background:rgba(16,185,129,.12);color:#10b981}
.dn{background:rgba(239,68,68,.12);color:#ef4444}
.fl{background:rgba(100,116,139,.12);color:#94a3b8}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:600}
.badge-slate{background:rgba(100,116,139,.12);color:#94a3b8}
.badge-indigo{background:rgba(99,102,241,.12);color:#818cf8}
.badge-purple{background:rgba(139,92,246,.12);color:#c084fc}
.badge-orange{background:rgba(249,115,22,.12);color:#fb923c}
.badge-cyan{background:rgba(6,182,212,.12);color:#22d3ee}
.badge-green{background:rgba(16,185,129,.1);color:#34d399}

/* ── Progress ── */
.pbar{height:3px;border-radius:99px;background:rgba(255,255,255,.05);overflow:hidden}
.pfill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.divider{border:none;border-top:1px solid rgba(255,255,255,.05);margin:12px 0}

/* ── Border accents ── */
.bt-indigo{border-top:2px solid #6366f1}
.bt-cyan{border-top:2px solid #06b6d4}
.bt-purple{border-top:2px solid #8b5cf6}
.bt-amber{border-top:2px solid #f59e0b}
.bt-green{border-top:2px solid #10b981}
.bl-acc{border-left:3px solid var(--acc)}

/* ── Header ── */
#hdr{position:sticky;top:0;z-index:50;background:rgba(7,16,29,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.05);padding:14px 16px 0;max-width:100%}
.hdr-inner{max-width:600px;margin:0 auto}
.live-dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 7px #10b981;flex-shrink:0}
.tab-bar{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.04);margin-top:12px}
.tbtn{flex:1;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:600;color:#64748b;transition:all .2s;border:none;background:none;font-family:'Sora',sans-serif;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn.act{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 2px 12px rgba(99,102,241,.3)}

/* ── Refresh ── */
.rbtn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;cursor:pointer;font-family:'Sora',sans-serif;box-shadow:0 2px 12px rgba(99,102,241,.3);transition:transform .15s}
.rbtn:active{transform:scale(.95)}
.rbtn svg{transition:transform .5s}
.rbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ── Panels ── */
.panel{display:none;padding:16px 16px 48px}
.panel.act{display:block}

/* ── Donut ── */
.donut-wrap{position:relative;width:174px;height:174px;margin:0 auto}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}

/* ── Row ── */
.arow{border-radius:14px;margin-bottom:10px;animation:fu .3s ease}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* ── Filter bar ── */
.fbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.fbar::-webkit-scrollbar{display:none}
.fpill{padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.05);color:#64748b;border:none;cursor:pointer;font-family:'Sora',sans-serif;transition:all .2s}
.fpill.act{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}

/* ── Section hdr ── */
.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:20px}
.shdr:first-child{margin-top:0}

/* ── Inner box ── */
.ibox{background:rgba(255,255,255,.025);border-radius:10px;padding:12px}

/* ── Sparkline ── */
.spark{width:72px!important;height:32px!important;flex-shrink:0}

/* ── Loading overlay ── */
#overlay{position:fixed;inset:0;background:rgba(7,16,29,.85);backdrop-filter:blur(6px);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#overlay.show{display:flex}
.spinner{width:44px;height:44px;border:3px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite}
.overlay-text{color:#94a3b8;font-size:14px;font-weight:600}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0c1d33;border:1px solid rgba(16,185,129,.3);color:#10b981;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:300;opacity:0;transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Last refresh badge ── */
#refresh-ts{font-size:10px;color:#475569;margin-top:2px}
</style>
</head>

const COLORS = ['#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b','#f97316','#ef4444','#ec4899','#84cc16','#14b8a6','#22d3ee','#a855f7','#fb923c'];
const CAT_COLORS = {'Flexi Cap':'#6366f1','Large Cap':'#06b6d4','Small Cap':'#f97316','Mid Cap':'#8b5cf6','ELSS':'#10b981','FOF':'#f59e0b','Debt/FOF':'#94a3b8'};

function fmt(n){
  const a=Math.abs(n),s=n<0?'-':'';
  if(a>=1e7) return s+'₹'+(a/1e7).toFixed(2)+'Cr';
  if(a>=1e5) return s+'₹'+(a/1e5).toFixed(2)+'L';
  if(a>=1e3) return s+'₹'+(a/1e3).toFixed(1)+'K';
  return s+'₹'+a.toFixed(0);
}
const fmtPct = n => (n>=0?'+':'')+n.toFixed(2)+'%';
const growth = (cur,inv) => inv>0?(cur-inv)/inv*100:0;
const pnl    = (cur,inv) => cur-inv;

function pillH(pct,lg){
  const cls=pct>0?'up':pct<0?'dn':'fl', arr=pct>0?'▲':pct<0?'▼':'—';
  return `<span class="pill${lg?' pill-lg':''} ${cls}"><span style="font-size:9px">${arr}</span>${fmtPct(pct)}</span>`;
}

// ══════════════════════════════════════════════════════════
const CR = {};
function donut(id, labels, values, colors, centerHtml){
  if(CR[id]){ CR[id].destroy(); delete CR[id]; }
  const ctx = document.getElementById(id);
  if(!ctx) return;
  CR[id] = new Chart(ctx.getContext('2d'),{
    type:'doughnut',
    data:{ labels, datasets:[{data:values, backgroundColor:colors, borderWidth:2, borderColor:'#07101d', hoverOffset:4}] },
    options:{
      cutout:'62%',
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#0c1d33', borderColor:'rgba(99,155,255,.15)', borderWidth:1,
          titleColor:'#e2e8f0', bodyColor:'#94a3b8', padding:10,
          callbacks:{ label: c=>' '+c.label+': '+fmt(c.raw) }
        }
      },
      animation:{duration:600}
    }
  });
  document.getElementById(id+'Lbl').innerHTML = centerHtml;
}

function spark(canvas, cur, inv){
  if(!canvas) return;
  const g = growth(cur, inv||cur*0.8);
  const pts = [];
  for(let i=0;i<=7;i++){
    const t=i/7, noise=(Math.sin(i*2.4)*.15+Math.sin(i*.8)*.1)*Math.abs(g)/100;
    pts.push((inv||cur*0.8)*(1+t*(g/100)+noise));
  }
  pts[7]=cur;
  const uid = 'sp_'+Math.random().toString(36).slice(2);
  canvas.id = uid;
  if(CR[uid]) CR[uid].destroy();
  CR[uid] = new Chart(canvas.getContext('2d'),{
    type:'line',
    data:{ labels:pts.map((_,i)=>i), datasets:[{data:pts, borderColor:g>=0?'#10b981':'#ef4444', borderWidth:1.5, pointRadius:0, fill:false, tension:.4}] },
    options:{ animation:false, plugins:{legend:{display:false},tooltip:{enabled:false}}, scales:{x:{display:false},y:{display:false}} }
  });
}

function legendH(items, total){
  return items.map(it=>`
    <div class="frow jbet mb2">
      <div class="frow gap2"><div style="width:8px;height:8px;border-radius:50%;background:${it.color};flex-shrink:0"></div><span class="xs sub">${it.name}</span></div>
      <div class="frow gap3">
        <div class="pbar" style="width:60px"><div class="pfill" style="width:${Math.max(3,it.value/total*100).toFixed(1)}%;background:${it.color}"></div></div>
        <span class="xs mono white" style="min-width:52px;text-align:right">${fmt(it.value)}</span>
      </div>
    </div>`).join('');
}

  if(i===2) renderMF();
}

// ══════════════════════════════════════════════════════════
//  LIVE REFRESH — calls Anthropic API which queries INDmoney MCP
// ══════════════════════════════════════════════════════════
async function liveRefresh(){
  const btn = document.getElementById('rbtn');
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('overlay-msg');
  btn.classList.add('spin');
  overlay.classList.add('show');
  msg.textContent = 'Connecting to INDmoney…';

  try {
    msg.textContent = 'Fetching portfolio snapshot…';

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        system: `You are a financial data extractor. Use the INDmoney MCP tools to fetch the user's portfolio data, then return ONLY a valid JSON object (no markdown, no explanation) with this exact structure:
{
  "totalCurrent": number,
  "totalInvested": number,
  "assets": [{"name":string,"value":number,"invested":number,"color":string}],
  "sectors": [{"sector":string,"value":number,"ret":number}],
  "marketCap": [{"name":string,"value":number,"pct":number,"ret":number,"color":string}],
  "epf": {"balance":number,"employer":number,"employee":number},
  "esops": {"currentValue":number,"vestedValue":number},
  "mutualFunds": [{"name":string,"amc":string,"category":string,"invested":number,"current":number,"nav":number,"units":number,"sipActive":boolean}],
  "indianStocks": [{"name":string,"ticker":string,"cap":string,"value":number,"qty":number}],
  "etfs": [{"name":string,"ticker":string,"type":string,"value":number,"qty":number}],
  "usStocks": [{"name":string,"ticker":string,"sector":string,"invested":number,"value":number}]
}
Call networth_snapshot first for totals/sectors/marketCap, then networth_holdings with asset_type MF for mutual funds, then IND_STOCK for stocks and ETFs, then US_STOCK for US stocks. Map the response accurately to the JSON structure above. For indianStocks exclude ETFs (those go in etfs array). Use exact values from the API.`,
        messages: [{ role: 'user', content: 'Fetch my complete INDmoney portfolio data and return it as JSON.' }],
        mcp_servers: [{ type: 'url', url: 'https://mcp.indmoney.com/mcp', name: 'indmoney' }]
      })
    });

    if(!res.ok) throw new Error(`API error ${res.status}`);
    const data = await res.json();

    // Extract JSON from response
    const textBlocks = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const jsonMatch = textBlocks.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('No JSON in response');

    const fresh = JSON.parse(jsonMatch[0]);

    // Merge into D
    if(fresh.totalCurrent) D.snapshot.totalCurrent = fresh.totalCurrent;
    if(fresh.totalInvested) D.snapshot.totalInvested = fresh.totalInvested;
    if(fresh.assets?.length) D.snapshot.assets = fresh.assets;
    if(fresh.sectors?.length) D.snapshot.sectors = fresh.sectors;
    if(fresh.marketCap?.length) D.snapshot.marketCap = fresh.marketCap;
    if(fresh.epf) D.snapshot.epf = fresh.epf;
    if(fresh.esops) D.snapshot.esops = fresh.esops;
    if(fresh.mutualFunds?.length) D.mutualFunds = fresh.mutualFunds;
    if(fresh.indianStocks?.length) D.indianStocks = fresh.indianStocks;
    if(fresh.etfs?.length) D.etfs = fresh.etfs;
    if(fresh.usStocks?.length) D.usStocks = fresh.usStocks;

    D.meta.lastSync = new Date();
    showToast('✓ Live data synced from INDmoney');

  } catch(e) {
    console.error('Refresh error:', e);
    showToast('⚠ Could not sync live data — showing cached values');
  } finally {
    btn.classList.remove('spin');
    overlay.classList.remove('show');
    updateSyncTime();
    // Re-render all tabs
    renderSummary();
    if(activeTab===1) renderStocks();
    if(activeTab===2) renderMF();
  }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderColor = msg.startsWith('✓')?'rgba(16,185,129,.3)':'rgba(249,115,22,.3)';
  t.style.color = msg.startsWith('✓')?'#10b981':'#fb923c';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3200);
}

function updateSyncTime(){
  const ts = document.getElementById('refresh-ts');
  ts.textContent = D.meta.lastSync
    ? 'Last synced: '+D.meta.lastSync.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})
    : 'Last synced: —';
}

// ══════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════
initTabs();
renderSummary();
</script>
